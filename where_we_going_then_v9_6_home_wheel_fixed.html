<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172033"><title>Where We Going Then?</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#172033;color:#fff;padding:16px 16px;position:sticky;top:0;z-index:1000;min-height:86px}h1{margin:0;padding-right:118px;font-size:21px;line-height:1.15}.sub{font-size:12px;opacity:.75;margin-top:3px;padding-right:118px}.homeTop{position:absolute;right:14px;top:50%;transform:translateY(-50%);border:0;background:#fff;color:#1769d2;border-radius:24px;padding:10px 14px;font-size:14px;font-weight:700;box-shadow:0 2px 8px #0002;z-index:2}.controls{display:flex;gap:7px;overflow-x:auto;padding:9px 10px;background:#fff;position:sticky;top:86px;z-index:900}button{border:1px solid #d1d5db;background:#fff;border-radius:18px;padding:9px 12px;font-size:13px;white-space:nowrap}button.active{background:#172033;color:#fff;border-color:#172033}#map{height:43vh;min-height:300px}.list{padding:9px 12px 100px}.hero,.card{background:#fff;border-radius:17px;margin:9px 0;padding:13px;box-shadow:0 2px 9px #0001}.hero b{font-size:13px}.big{font-size:23px;font-weight:900;margin-top:4px}.card{padding:0;overflow:hidden}.photos{display:grid;grid-template-columns:1fr 1fr;height:145px;background:#ddd}.photos img{width:100%;height:145px;object-fit:cover}.body{padding:13px}.top{display:flex;justify-content:space-between;gap:10px}.name{font-weight:800;font-size:17px}.price{font-size:18px;font-weight:900;white-space:nowrap}.meta,.history{font-size:12px;color:#667085;line-height:1.45;margin-top:5px}.tag{display:inline-block;background:#ecfdf5;color:#047857;border-radius:10px;padding:3px 7px;margin:7px 4px 0 0;font-size:11px}.nav{display:inline-block;background:#172033;color:#fff;text-decoration:none;padding:8px 11px;border-radius:12px;font-size:12px;margin-top:10px}.distance{float:right}.price-marker{background:#172033;color:#fff;border-radius:13px;padding:4px 7px;font-weight:900;font-size:12px;box-shadow:0 2px 6px #0003;border:2px solid #fff}.modal{position:fixed;inset:0;background:#0008;z-index:3000;display:none;align-items:flex-end}.box{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:18px 16px 28px;max-height:85vh;overflow:auto}.close{float:right;border:0;background:#eee;padding:7px 11px;border-radius:50%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.grid button{font-size:17px;padding:16px}.start{position:fixed;inset:0;background:linear-gradient(160deg,#172033,#31415f);z-index:5000;color:#fff;display:flex;align-items:center;justify-content:center;padding:22px}.startbox{width:min(520px,100%);text-align:center}.startbox h2{font-size:34px;margin:0 0 8px}.startbox p{opacity:.78;margin:0 0 24px}.choice{display:grid;gap:12px}.choice button{font-size:18px;padding:18px;font-weight:800}.choice small{display:block;font-size:11px;color:#667085;margin-top:4px;font-weight:500}.cityscreen{display:none}.citygrid{display:grid;gap:12px}.citygrid button{font-size:18px;padding:18px}.back{margin-top:14px;background:transparent!important;color:#fff!important;border-color:#ffffff55!important}.routeitem{padding:11px 0;border-bottom:1px solid #eee}.total{background:#f3f4f6;padding:11px;border-radius:12px;margin-top:10px;font-weight:800}.muted{font-size:12px;color:#667085}.wheelScreen{display:none;position:fixed;inset:0;background:linear-gradient(160deg,#172033,#31415f);z-index:6000;color:#fff;align-items:center;justify-content:center;padding:22px}.wheelbox{width:min(520px,100%);text-align:center}.wheelbox h2{font-size:32px;margin:0 0 8px}.wheelbox p{opacity:.78;margin:0 0 22px}.wheel{width:230px;height:230px;border-radius:50%;margin:0 auto 24px;border:10px solid #fff;position:relative;overflow:hidden;background:conic-gradient(#f7f7f7 0deg 180deg,#dbeafe 180deg 360deg);box-shadow:0 8px 30px #0005;transition:transform 2.2s cubic-bezier(.15,.8,.2,1)}.wheel:before{content:"🍺  🥤  📍";position:absolute;left:9%;top:36%;font-size:30px;letter-spacing:2px;transform:rotate(-8deg)}.wheel:after{content:"Cambridge  Norwich  Thetford";position:absolute;left:11%;top:53%;font-size:11px;font-weight:800;white-space:nowrap;transform:rotate(8deg)}.pointer{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid #fff;margin:-8px auto 10px;position:relative;z-index:2}.spinAction{font-size:18px;font-weight:800;padding:15px 28px;background:#fff;color:#172033;border:0}.wheelResult{min-height:25px;font-size:18px;font-weight:800;margin:14px 0}.wheelBack{margin-top:8px;background:transparent!important;color:#fff!important;border-color:#ffffff55!important}
</style></head><body>
<div id="start" class="start"><div class="startbox"><h2>🍺 Where We Going Then?</h2><p>What are we doing today?</p><div class="choice"><button onclick="chooseMode('drink')">🍻 I’m drinking<small>Pubs • pints • real ale • pub crawl</small></button><button onclick="chooseMode('nodrink')">🥤 I’m not drinking<small>Coffee • 0.0% • food • somewhere nice</small></button><button onclick="randomMode()">🎡 I’m not sure — spin the wheel<small>Let the app decide</small></button></div></div></div>
<div id="wheelScreen" class="wheelScreen"><div class="wheelbox"><h2>🎡 Let the wheel decide</h2><p>Let the wheel choose your city and your plan.</p><div class="pointer"> </div><div id="wheel" class="wheel"></div><button class="spinAction" onclick="doWheelSpin()">SPIN THE WHEEL</button><div id="wheelResult" class="wheelResult"></div><button class="wheelBack" onclick="closeWheel()">← Back</button></div></div>
<div id="cities" class="start cityscreen"><div class="startbox"><h2>📍 Where are we going?</h2><p>Pick a city.</p><div class="citygrid"><button onclick="chooseCity('Cambridge')">📍 Cambridge</button><button onclick="chooseCity('Norwich')">📍 Norwich</button><button onclick="chooseCity('Thetford')">📍 Thetford</button></div><button class="back" onclick="backStart()">← Back</button></div></div>
<header><button class="homeTop" onclick="goHome()">🏠 Home</button><h1>🍺 Where We Going Then?</h1><div class="sub" id="sub">Pints • coffee • food • places worth going</div></header>
<div class="controls"><button id="drinkBtn" onclick="setMode('drink',this)">🍻 Drinking</button><button id="nodrinkBtn" onclick="setMode('nodrink',this)">🥤 Not drinking</button><button onclick="spinWheel()">🎡 Spin</button><button class="active" onclick="setFilter('cheap',this)">💷 Best value</button><button onclick="setFilter('all',this)">All</button><button onclick="setFilter('historic',this)">🏛 Historic</button><button onclick="setFilter('realale',this)">🍺 Real ale</button><button onclick="locateMe()">📍 Near me</button><button id="crawlBtn" onclick="openCrawl()">🍺 Pub Crawl</button></div>
<div id="map"></div><div class="list"><div class="hero"><b>✨ Quick pick</b><div id="quick" class="big">Loading…</div><div id="quickMeta" class="muted"></div></div><div id="list"></div></div>
<div id="crawl" class="modal" onclick="if(event.target.id==='crawl')closeCrawl()"><div class="box"><button class="close" onclick="closeCrawl()">✕</button><h2>🍺 Build My Pub Crawl</h2><div class="grid"><label>Budget<select id="budget"><option>15</option><option selected>20</option><option>25</option><option>30</option></select></label><label>Pubs<select id="pubcount"><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label></div><button onclick="buildCrawl()" style="width:100%;background:#172033;color:#fff">Find my crawl</button><div id="route"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const places=[
['The Castle Inn','Cambridge','pub',52.2089,-.1164,2.8,4.3,['historic','realale'],'Southwold Bitter','The Castle Inn Cambridge pub'],['Champion of the Thames','Cambridge','pub',52.2044,-.1265,4.3,4.7,['historic','realale'],'Carlsberg','Champion of the Thames Cambridge pub'],['The Pickerel','Cambridge','pub',52.2102,-.1136,5.2,4.5,['historic'],'Pint from','Pickerel Cambridge pub'],['The Eagle','Cambridge','pub',52.2024,-.1197,5.8,4.4,['historic'],'Pint from','Eagle pub Cambridge'],['The Free Press','Cambridge','pub',52.2110,-.1274,4.8,4.6,['historic','realale'],'Pint from','Free Press Cambridge pub'],['The Cambridge Blue','Cambridge','pub',52.1949,-.1345,5.0,4.5,['realale'],'Pint from','Cambridge Blue pub'],
['Hot Numbers Coffee – Trumpington St','Cambridge','cafe',52.1979,-.1218,3.5,4.5,['coffee'],'Coffee','Hot Numbers Coffee Trumpington Street Cambridge'],['Aromi – Bene\'t Street','Cambridge','cafe',52.2021,-.1193,4,4.6,['coffee','food'],'Coffee','Aromi Bene\'t Street Cambridge'],['Fitzbillies','Cambridge','cafe',52.1972,-.1250,4.5,4.5,['coffee','food'],'Coffee','Fitzbillies Cambridge'],
["King's Head",'Norwich','pub',52.6298,1.2990,5,4.7,['historic','realale'],'Real ale',"King's Head Norwich pub"],['The Adam and Eve','Norwich','pub',52.6318,1.3008,5.2,4.5,['historic','realale'],'Real ale','Adam and Eve Norwich pub'],['The Golden Star','Norwich','pub',52.6334,1.2980,4.8,4.5,['historic','realale'],'Real ale','Golden Star Norwich pub'],['The Ten Bells','Norwich','pub',52.6291,1.2945,5,4.5,['realale'],'Real ale','Ten Bells Norwich pub'],['Strangers Coffee House','Norwich','cafe',52.6280,1.2931,3.5,4.6,['coffee'],'Coffee','Strangers Coffee House Norwich'],['The Bicycle Shop','Norwich','cafe',52.6256,1.2923,4,4.5,['coffee','food'],'Coffee','The Bicycle Shop Norwich cafe'],['Kofra Coffee','Norwich','cafe',52.6289,1.2947,3.5,4.5,['coffee'],'Coffee','Kofra Coffee Norwich'],
['Red Lion','Thetford','pub',52.4127,.7495,4.2,4.3,['realale'],'Real ale','Red Lion Wetherspoon Thetford pub'],['Black Horse','Thetford','pub',52.4137,.7468,4.5,4.4,['realale'],'Real ale','Black Horse Thetford pub'],['Dolphin Inn','Thetford','pub',52.4147,.7460,4.5,4.3,['historic','realale'],'Real ale','Dolphin Inn Thetford pub'],['Albion','Thetford','pub',52.4161,.7485,4.4,4.2,['realale'],'Real ale','Albion Thetford pub'],['The Riverside Kiosk','Thetford','cafe',52.4148,.7523,3,4.8,['coffee','food'],'Coffee','The Riverside Kiosk Thetford'],["Mama D's",'Thetford','cafe',52.4140,.7476,4,4.8,['coffee','food'],'Coffee',"Mama D's Thetford cafe"],['Tall Orders Coffee Shop','Thetford','cafe',52.4131,.7479,3.5,4.5,['coffee'],'Coffee','Tall Orders Coffee Shop Thetford']
].map(x=>({name:x[0],city:x[1],type:x[2],lat:x[3],lng:x[4],price:x[5],rating:x[6],tags:x[7],item:x[8],search:x[9]}));
const centers={Cambridge:[52.205,-.122],Norwich:[52.630,1.296],Thetford:[52.414,.749]};let city='Cambridge',mode='drink',filter='cheap',markers=[],userPos=null,photos={},map=null;function initMap(){if(map||!window.L)return false;try{map=L.map('map').setView(centers.Cambridge,15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);return true}catch(e){return false}}
function goHome(){
  document.getElementById('cities').style.display='none';
  document.getElementById('wheelScreen').style.display='none';
  document.getElementById('start').style.display='flex';
  window.scrollTo(0,0);
}
function chooseMode(m){
  mode=m;
  document.getElementById('start').style.display='none';
  document.getElementById('cities').style.display='flex';
}
function backStart(){
  document.getElementById('cities').style.display='none';
  document.getElementById('start').style.display='flex';
}
function chooseCity(c){
  city=c;
  document.getElementById('cities').style.display='none';
  document.getElementById('sub').textContent=c+' • '+(mode==='drink'?'pubs • pints • real ale':'coffee • 0.0% • food • somewhere nice');
  document.getElementById('drinkBtn').classList.toggle('active',mode==='drink');
  document.getElementById('nodrinkBtn').classList.toggle('active',mode==='nodrink');
  document.getElementById('crawlBtn').style.display=mode==='drink'?'inline-block':'none';
  if(initMap()) map.setView(centers[c],15);
  render();
}
function randomMode(){
  document.getElementById('wheelScreen').style.display='flex';
  document.getElementById('wheelResult').textContent='';
  document.getElementById('wheel').style.transform='rotate(0deg)';
}
function closeWheel(){document.getElementById('wheelScreen').style.display='none'}
function doWheelSpin(){
  const options=[['Cambridge','drink'],['Cambridge','nodrink'],['Norwich','drink'],['Norwich','nodrink'],['Thetford','drink'],['Thetford','nodrink']];
  const idx=Math.floor(Math.random()*options.length);
  const pick=options[idx];
  const cityPick=pick[0];
  const modePick=pick[1];
  mode=modePick;
  const extra=1800+idx*60;
  document.getElementById('wheel').style.transform='rotate('+extra+'deg)';
  setTimeout(function(){
    city=cityPick;
    mode=modePick;
    document.getElementById('wheelResult').textContent=(modePick==='drink'?'🍺 ':'🥤 ')+cityPick+' — '+(modePick==='drink'?'I’m drinking!':'I’m not drinking!');
    setTimeout(function(){
      closeWheel();
      chooseCity(cityPick);
    },900);
  },2300);
}
function spinWheel(){
  randomMode();
}
function setMode(m,b){mode=m;document.querySelectorAll('.controls button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('sub').textContent=`${city} • ${mode==='drink'?'pubs • pints • real ale':'coffee • 0.0% • food • somewhere nice'}`;document.getElementById('crawlBtn').style.display=mode==='drink'?'inline-block':'none';render()}function setFilter(f,b){filter=f;document.querySelectorAll('.controls button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function data(){let a=places.filter(p=>p.city===city&&p.type===(mode==='drink'?'pub':'cafe'));if(filter==='historic')a=a.filter(p=>p.tags.includes('historic'));if(filter==='realale')a=a.filter(p=>p.tags.includes('realale'));if(userPos)a.forEach(p=>p.distance=dist(userPos.lat,userPos.lng,p.lat,p.lng));a.sort((x,y)=>filter==='cheap'?x.price-y.price:(userPos?x.distance-y.distance:y.rating-x.rating));return a}function dist(a,b,c,d){const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,q=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
async function getPhotos(p){if(photos[p.name])return photos[p.name];try{let u='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(p.search)+'&gsrnamespace=6&gsrlimit=2&prop=imageinfo&iiprop=url&iiurlwidth=700&format=json&origin=*';let d=await (await fetch(u)).json();photos[p.name]=Object.values(d.query?.pages||{}).map(x=>x.imageinfo?.[0]?.thumburl).filter(Boolean).slice(0,2)}catch(e){photos[p.name]=[]}return photos[p.name]}
async function render(){if(!map)initMap();markers.forEach(m=>{if(map)map.removeLayer(m)});markers=[];const a=data();document.getElementById('list').innerHTML='';if(!map)document.getElementById('map').innerHTML='<div style="padding:28px;text-align:center;background:#e5e7eb;color:#475467;font-weight:700">Map is temporarily unavailable. The places list below is still working.</div>';a.forEach((p,i)=>{if(!map)return;let icon=L.divIcon({className:'',html:`<div class="price-marker">${p.type==='pub'?'£'+p.price.toFixed(2):'☕'}</div>`,iconSize:[58,26],iconAnchor:[29,13]});let m=L.marker([p.lat,p.lng],{icon}).addTo(map);m.bindPopup(`<b>${p.name}</b><br>${p.type==='pub'?'£'+p.price.toFixed(2):'☕ '+p.item}<br>⭐ ${p.rating}<br><a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.name+', '+city)}">Navigate</a>`);markers.push(m);loadCard(p,i)});let q=a[0];document.getElementById('quick').textContent=q?(q.type==='pub'?`£${q.price.toFixed(2)} · ${q.name}`:`☕ ${q.name}`):'Nothing found';document.getElementById('quickMeta').textContent=q?`${city} · ⭐ ${q.rating} · ${q.item}`:''}
async function loadCard(p,i){let imgs=await getPhotos(p),ph=imgs.length?`<div class="photos">${imgs.map(u=>`<img loading="lazy" src="${u}" alt="${p.name}">`).join('')}</div>`:'';let d=p.distance?`<span class="distance">${(p.distance*.621371).toFixed(1)} mi</span>`:'';let c=document.createElement('div');c.className='card';c.innerHTML=ph+`<div class="body"><div class="top"><div class="name">${i+1}. ${p.name}</div><div class="price">${p.type==='pub'?'£'+p.price.toFixed(2):'☕'}</div></div><div class="meta">⭐ ${p.rating} · ${p.item}${d}</div>${p.tags.includes('historic')?'<span class="tag">Historic</span>':''}${p.tags.includes('realale')?'<span class="tag">Real ale</span>':''}${p.tags.includes('coffee')?'<span class="tag">Coffee</span>':''}<div class="history">${p.type==='pub'?'🍺 Pub':'☕ Café'} · prices are indicative.</div><a class="nav" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.name+', '+city)}">📍 Navigate</a></div>`;document.getElementById('list').appendChild(c)}
function locateMe(){if(!navigator.geolocation)return alert('Location unavailable.');navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lng:p.coords.longitude};if(initMap()){map.setView([userPos.lat,userPos.lng],14);L.marker([userPos.lat,userPos.lng]).addTo(map).bindPopup('You are here').openPopup();}render()},()=>alert('Allow location access in Safari to use Near me.'))}
function openCrawl(){document.getElementById('crawl').style.display='flex'}function closeCrawl(){document.getElementById('crawl').style.display='none'}function buildCrawl(){let pubs=places.filter(p=>p.city===city&&p.type==='pub').sort((a,b)=>b.rating-a.rating||a.price-b.price),budget=+document.getElementById('budget').value,n=+document.getElementById('pubcount').value,chosen=[],total=0;for(const p of pubs){if(chosen.length<n&&total+p.price<=budget){chosen.push(p);total+=p.price}}if(chosen.length<n)for(const p of pubs)if(!chosen.includes(p)&&chosen.length<n){chosen.push(p);total+=p.price}document.getElementById('route').innerHTML=`<div class="total">🍺 ${chosen.length} pubs · estimated total £${total.toFixed(2)}</div>`+chosen.map((p,i)=>`<div class="routeitem"><b>${i+1}. ${p.name}</b> — £${p.price.toFixed(2)}<br><small>⭐ ${p.rating} · ${p.item}</small><br><a class="nav" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.name+', '+city)}">📍 Navigate</a></div>`).join('')}
initMap();chooseMode('drink');document.getElementById('start').style.display='flex';document.getElementById('cities').style.display='none';
</script></body></html>
